<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho - BIGODE AUTOPEÇAS</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    
    <header class="main-header">
        <div class="container-fluid border-bottom border-secondary py-2">
            <div class="container d-flex justify-content-between align-items-center flex-wrap">
                <nav class="top-nav">
                    <a href="index.html" class="text-light text-decoration-none me-3 small">Home</a>
                    <a href="produtos.html" class="text-light text-decoration-none me-3 small">Produtos</a>
                    <a href="index.html#quem-somos" class="text-light text-decoration-none small">Quem Somos</a>
                </nav>
                <div class="user-actions d-flex align-items-center gap-3">
                    <a href="login.html" class="text-light fs-5"><i class="fas fa-user-circle"></i></a>
                    </div>
            </div>
        </div>

        <div class="container py-4">
            <div class="row align-items-center g-3">
                <div class="col-12 col-md-3 text-center text-md-start">
                    <a href="index.html">
                        <img src="src/img/logobranco.png" alt="BIGODE" class="img-fluid" style="max-height: 100px;">
                    </a>
                </div>
                <div class="col-12 col-md-9">
                    <div class="input-group search-box-custom">
                        <input type="text" class="form-control" placeholder="Buscar peça...">
                        <button class="btn btn-red" type="button"><i class="fas fa-search"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="py-5" style="background-color: var(--color-light-bg-products);">
        
        <div class="container mb-4">
            <h1 class="section-title text-dark border-bottom border-danger pb-2">MEU CARRINHO</h1>
        </div>

        <div class="container cart-container">
            <div class="row g-4">
                
                <div class="col-12 col-lg-8 cart-items-section">
                    
                    <div class="d-none d-md-flex justify-content-between bg-dark text-white p-3 rounded-top fw-bold cart-table-header">
                        <span class="w-50">Produto</span>
                        <span class="w-15 text-center">Qtd.</span>
                        <span class="w-15 text-end">Preço Unit.</span>
                        <span class="w-20 text-end">Total</span>
                    </div>

                    <div id="cart-items-container" class="bg-white border rounded-bottom shadow-sm p-3">
                        </div>

                    <div class="mt-4">
                        <a href="produtos.html" class="btn btn-outline-dark">
                            <i class="fas fa-arrow-left me-2"></i> Continuar Comprando
                        </a>
                    </div>
                </div>
                
                <div class="col-12 col-lg-4">
                    <aside class="bg-white p-4 rounded shadow-sm cart-summary">
                        <h2 class="h4 oswald-font text-danger border-bottom pb-2 mb-3">Resumo do Pedido</h2>
                        
                        <div class="d-flex justify-content-between mb-2 summary-line">
                            <span class="text-secondary">Subtotal:</span>
                            <span class="fw-bold summary-value" id="cart-subtotal">R$ 0,00</span>
                        </div>
                        
                        <div class="my-4 border-top border-bottom py-3 summary-shipping">
                            <h3 class="h6 fw-bold mb-3">Calcular Frete</h3>
                            <div class="input-group mb-2 shipping-input">
                                <input type="text" class="form-control" placeholder="CEP">
                                <button class="btn btn-dark btn-calculate-shipping"><i class="fas fa-truck-moving"></i></button>
                            </div>
                            <div class="d-flex justify-content-between text-secondary small">
                                <span>Frete estimado:</span>
                                <span class="fw-bold text-dark summary-value" id="cart-shipping">R$ 0,00</span>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mb-4 summary-total-final">
                            <span class="fs-5 fw-bold">Total Final:</span>
                            <span class="fs-4 fw-bold text-danger final-price" id="cart-total">R$ 0,00</span>
                        </div>
                        
                        <a href="pagamento.html" class="btn btn-red w-100 py-3 fw-bold mb-3 btn-checkout">
                            FINALIZAR COMPRA <i class="fas fa-credit-card ms-2"></i>
                        </a>

                        <div class="text-center text-success small secure-info">
                            <i class="fas fa-lock me-1"></i> Pagamento 100% Seguro
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer py-4 text-center mt-5">
        <div class="container">
            <div class="social-media mb-3">
                <a href="#" class="text-secondary mx-2 fs-4"><i class="fab fa-whatsapp"></i></a>
                <a href="#" class="text-secondary mx-2 fs-4"><i class="fab fa-instagram"></i></a>
            </div>
            <p class="text-secondary small m-0">Desenvolvido por BigTech © 2025</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
