<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - BIGODE AUTOPEÇAS</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="auth-body">
    <header class="mobile-auth-header">
        <a href="login.html" class="back-button"><i class="fas fa-arrow-left"></i></a>
        <div class="logo-area">
            <img src="../bigodeAutoPeca/src/img/logobranco.png" alt="BIGODE AUTOPEÇAS" class="logo-mini">
        </div>
    </header>

    <div class="auth-container">
        
        <h2>Criar Conta</h2>

        <form class="cadastro-form"> <div class="fields-row">
                <div class="form-group half-width">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required class="input-light">
                </div>
                
                <div class="form-group half-width">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required class="input-light">
                </div>
            </div>

            <div class="fields-row">
                <div class="form-group half-width">
                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" name="celular" required class="input-light">
                </div>
                
                <div class="form-group half-width">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" required class="input-light">
                </div>
            </div>
            
            <button type="submit" class="btn-primary-auth">Cadastrar</button>
        </form>

        <div class="auth-links">
            <span>Já tem uma conta?</span>
            <a href="login.html">Faça login</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
