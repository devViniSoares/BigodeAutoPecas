<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BIGODE AUTOPEÇAS</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* Estilo específico para centralizar o background de login */
        body.auth-body {
            background-color: #212121;
            background-image: radial-gradient(circle at center, #36393D 0%, #212121 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background-color: rgba(54, 57, 61, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="auth-body">

    <div class="position-absolute top-0 start-0 p-4">
        <a href="index.html" class="text-white fs-3 back-button"><i class="fas fa-arrow-left"></i></a>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                
                <div class="text-center mb-4">
                    <img src="src/img/logobranco.png" alt="BIGODE" class="img-fluid" style="height: 100px;">
                </div>

                <div class="auth-card p-4 p-md-5">
                    <h2 class="text-center text-danger oswald-font mb-4 text-uppercase fw-bold">Login</h2>
                    
                    <form class="login-form">
                        <div class="mb-3">
                            <label for="email" class="form-label text-light fw-bold small">EMAIL</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com" required>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="senha" class="form-label text-light fw-bold small">SENHA</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="senha" name="senha" placeholder="******" required>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-red w-100 py-2 fw-bold fs-5">ENTRAR</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <span class="text-secondary small">Não tem conta?</span>
                        <a href="cadastro.html" class="text-danger fw-bold text-decoration-none ms-1">Crie uma agora</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
